name: release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (for example v1.0.0)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Same NuGet fallback path as build.yml: a release must never depend on a
      # local Emby install being present on the runner.
      - name: Build
        run: dotnet build src/Emby.Plugins.Bangumi/Emby.Plugins.Bangumi.csproj -c Release

      - name: Collect artifacts
        run: |
          mkdir -p dist
          cp src/Emby.Plugins.Bangumi/bin/Release/Emby.Plugins.Bangumi.dll dist/
          cd dist
          sha256sum Emby.Plugins.Bangumi.dll > Emby.Plugins.Bangumi.dll.sha256
          ls -l

      - name: Resolve tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          files: |
            dist/Emby.Plugins.Bangumi.dll
            dist/Emby.Plugins.Bangumi.dll.sha256
